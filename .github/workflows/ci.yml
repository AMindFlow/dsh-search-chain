name: ci

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

# 同一 PR/分支的 push 与 PR 事件共用一个跑位：后到者取消在跑者。
# T10-1 堆帽竞态实测：两个 test job 同 runner 并行时 RSS 兜底闸会先于 V8 OOM 落地（三次复现，均重跑即绿）。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # 仓库不提交锁文件（见 .gitignore），setup-node 的 cache: npm 需要锁文件，
      # 因此这里以 package.json 为键缓存 npm 下载目录。
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 无锁文件时 npm ci 不可用；四个 @deepseek-ai/* 依赖为精确版本 pin，
      # 依赖从默认 registry（registry.npmjs.org）解析，仓库内无 .npmrc。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test
